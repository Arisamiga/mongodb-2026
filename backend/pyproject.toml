[project]
name = "lost-found-api"
version = "0.1.0"
description = "MongoDB-backed lost-property API with semantic matching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pymongo>=4.11,<5",
    "pydantic-settings>=2.8,<3",
    "email-validator>=2.2,<3",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
ai = ["sentence-transformers>=5,<6", "torch>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "mongomock>=4.3,<5", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
